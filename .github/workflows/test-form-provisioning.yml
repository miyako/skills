name: Test form provisioning

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "4d-skills/**"
      - "README.md"
      - ".github/scripts/validate_skills.py"
      - ".github/scripts/test_provision_fourdform.py"
      - ".github/scripts/smoke_fourdform_release.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-form-provisioning.yml"
      - ".gitmodules"
  push:
    branches: [main]
    paths:
      - "4d-skills/**"
      - "README.md"
      - ".github/scripts/validate_skills.py"
      - ".github/scripts/test_provision_fourdform.py"
      - ".github/scripts/smoke_fourdform_release.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-form-provisioning.yml"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test provisioning without downloads or executing release binaries
        run: python3 .github/scripts/test_provision_fourdform.py
      - name: Validate skills
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/validate_skills.py

  live-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Provision latest skills release and verify actual PNG output
        run: |
          python3 .github/scripts/smoke_fourdform_release.py \
            --consumer-root "$RUNNER_TEMP/fourdform-consumer"
